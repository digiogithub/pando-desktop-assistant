# cargo-deny configuration. The project is MIT (AGENTS.md section 6): anything not listed in
# the license allow-list (notably GPL-*, AGPL-*, LGPL-*) is denied in the whole graph.
[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

# espeak-ng (GPL-3, linked through sherpa-onnx for Piper/Kokoro) is a bundled C library, not a
# crate, so cargo-deny does not see it and no exception entry is needed today. It is allowed
# only inside the separate `pando-tts` worker (PDA-T-0023). If a GPL-licensed crate is ever
# pulled in by `pando-tts`, add a `[[licenses.exceptions]]` entry scoped to that crate and
# keep `app` free of it. Embedded fonts, models and voices are data files with their own
# licences; they are recorded in the NOTICE file, not here.

[bans]
multiple-versions = "warn"
wildcards = "allow"
# GPL Zed crates have generic names (editor, ui, theme, ...), so they are blocked by the
# license allow-list rather than by name. The crates.io `gpui` crate must never be a dependency
# (GPUI comes only through `gpui-kit`, which pins `gpui-pre`).
deny = [
    { crate = "gpui", reason = "use gpui-kit, which pins gpui-pre" },
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices transitive through gpui-kit / gpui-pre; we cannot patch them.
# Re-evaluate when gpui-kit is bumped. No vulnerability is ignored.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; transitive via gpui-kit" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via gpui-kit" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive via gpui-kit" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; transitive via gpui-pre" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via gpui-pre" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
