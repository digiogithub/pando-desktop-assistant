[package]
name = "app"
description = "GPUI desktop application pando-assistant (the only crate that uses gpui-kit)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "pando-assistant"
path = "src/main.rs"

[features]
# CPU raster fallback of the organism for software GPUs (PDA-T-0042).
default = ["raster"]
raster = ["dep:tiny-skia", "dep:image"]

[dependencies]
tiny-skia = { version = "0.11", optional = true }
image = { version = "0.25", default-features = false, optional = true }
gpui-kit.workspace = true
pando-client = { path = "../pando-client" }
anyhow.workspace = true
async-channel.workspace = true
clap.workspace = true
directories.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
lyon_tessellation = "1.0.22"
organism = { path = "../organism" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
