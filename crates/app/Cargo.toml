[package]
name = "app"
description = "GPUI desktop application pando-assistant (the only crate that uses gpui-kit)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "pando-assistant"
path = "src/main.rs"

[features]
# CPU raster fallback of the organism for software GPUs (PDA-T-0042).
default = ["raster"]
raster = ["dep:tiny-skia", "dep:image"]
# PipeWire audio host (Linux release builds; needs libpipewire-0.3-dev, libspa-0.2-dev, libclang).
pipewire = ["audio/pipewire"]

[dependencies]
tiny-skia = { version = "0.11", optional = true }
image = { version = "0.25", default-features = false, optional = true }
gpui-kit.workspace = true
pando-client = { path = "../pando-client" }
models = { path = "../models" }
anyhow.workspace = true
async-channel.workspace = true
clap.workspace = true
directories.workspace = true
pulldown-cmark.workspace = true
similar.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
lyon_tessellation = "1.0.22"
organism = { path = "../organism" }
audio = { path = "../audio" }
models = { path = "../models" }
speech = { path = "../speech" }
voice-proto = { path = "../voice-proto" }
decide = { path = "../decide" }
claude-bridge = { path = "../claude-bridge" }
reqwest.workspace = true

global-hotkey = "0.7"
velopack = "=1.2.161"

# Linux-only shell backends (async-io flavour: ashpd refuses tokio next to GPUI, T-0026).
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
futures-lite = "2"
futures-util = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.21"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
hound = "3.5"
