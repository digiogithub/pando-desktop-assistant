[package]
name = "pando-tts"
description = "TTS worker: sherpa-onnx Piper/Kokoro with espeak-ng; GPL-3 as a distributed binary (ADR 0007)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "pando_tts"
path = "src/lib.rs"

[[bin]]
name = "pando-tts"
path = "src/main.rs"

[dependencies]
voice-proto = { path = "../voice-proto" }
speech = { path = "../speech" }
# Prebuilt libraries are fine here: this process is the GPL-3 one (espeak-ng is linked on purpose).
sherpa-onnx = "=1.13.8"
thiserror.workspace = true
