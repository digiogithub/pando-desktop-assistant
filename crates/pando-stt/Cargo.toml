[package]
name = "pando-stt"
description = "STT worker: Whistle (libneedle), VAD and wake word in a separate permissive process (ADR 0007)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "pando_stt"
path = "src/lib.rs"

[[bin]]
name = "pando-stt"
path = "src/main.rs"

[[bin]]
name = "wake-eval"
path = "src/bin/wake_eval.rs"

[dependencies]
needle-sys = { path = "../needle-sys" }
voice-proto = { path = "../voice-proto" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hound = "3.5"
sherpa-onnx = { version = "=1.13.8", optional = true, default-features = false, features = ["static"] }


[features]
# Parakeet-TDT v3 fallback through sherpa-onnx. OFF by default: it needs a sherpa-onnx built
# from source with TTS OFF (`scripts/build-sherpa-stt.sh`, then SHERPA_ONNX_LIB_DIR=...), because
# the prebuilt libraries embed espeak-ng (GPL-3). See ADR 0007 and docs.
parakeet = ["dep:sherpa-onnx"]
# Silero VAD v5 through the same TTS-off sherpa-onnx build. OFF by default: without it the
# built-in energy VAD is used (PDA-T-0136).
silero-vad = ["dep:sherpa-onnx"]
