[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/sevir/pando-assistant"
authors = ["Pando Assistant contributors"]

[workspace.dependencies]
# Exact pins; add real dependencies here as tasks need them.
gpui-kit = "=0.7.1"
anyhow = "1"
cargo_metadata = "0.23"
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
axum = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
async-channel = "2.5"
directories = "6"
rust-i18n = "4.2"
sys-locale = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
pulldown-cmark = { version = "0.13", default-features = false }
similar = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"
