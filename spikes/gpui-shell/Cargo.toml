[package]
name = "gpui-shell-spikes"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Throwaway spikes S5/S6/S8: GPUI paths perf, mini window, global hotkey + tray (PDA-T-0024/0025/0026)."

[dependencies]
gpui-kit = "=0.7.1"
anyhow = "1"
tiny-skia = "0.11"
serde_json = "1"
async-channel = "2.5"
global-hotkey = "0.7"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-lite = "2"
futures-util = "0.3"

[workspace]
